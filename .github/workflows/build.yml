name: Build and Release

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build and Package
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18.x'
        cache: 'npm'

    - name: Install dependencies
      run: |
        npm ci
        npx electron-builder install-app-deps

    - name: Build application
      run: |
        # Clean build directory
        if (Test-Path -Path "build") { Remove-Item -Recurse -Force build }
        New-Item -ItemType Directory -Force -Path "build" | Out-Null
        
        # Build React app
        npm run build
        
        # Copy Electron files
        node scripts/copy-electron.js

    - name: Package application
      run: |
        # Ensure build directory exists
        if (-not (Test-Path -Path "build/electron.js")) {
            Write-Error "electron.js not found in build directory"
            exit 1
        }
        
        # Run electron-builder with debug info
        $env:DEBUG = "electron-builder"
        npx electron-builder --win --x64 --config.directories.output=dist

    - name: List build artifacts
      run: |
        Write-Output "Build artifacts:"
        if (Test-Path -Path "dist") {
            Get-ChildItem -Path "dist" -Recurse | Format-Table FullName,Length,LastWriteTime
        } else {
            Write-Output "No dist directory found"
        }

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: NexusExplorer-Artifacts
        path: |
          dist/
        retention-days: 1
        if-no-files-found: warn

    - name: Create Release
      id: create_release
      uses: actions/create-release@v1
      if: github.event_name == 'push' && contains(github.ref, 'refs/tags/')
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        tag_name: ${{ github.ref }}
        release_name: Release ${{ github.ref }}
        draft: false
        prerelease: false

    - name: Upload Release Asset
      id: upload-release-asset 
      uses: actions/upload-release-asset@v1.0.2
      if: github.event_name == 'push' && contains(github.ref, 'refs/tags/')
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ./dist/Nexus Explorer Setup ${{ github.ref_name }}.exe
        asset_name: NexusExplorer-Setup-${{ github.ref_name }}.exe
        asset_content_type: application/octet-stream