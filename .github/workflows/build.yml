name: Build and Release

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build and Package
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18.x'
        cache: 'npm'

    - name: Install dependencies
      run: |
        npm ci --ignore-scripts
        npx electron-builder install-app-deps

    - name: Build application
      run: |
        # Clean and recreate build directory
        if [ -d "build" ]; then
          rm -rf build
        fi
        mkdir -p build
        
        # Build React app
        npm run build
        
        # Verify build output
        echo "Build directory contents after React build:"
        ls -la build/
        
        # Copy Electron files
        node scripts/copy-electron.js
        
        echo "Build directory contents after copy-electron.js:"
        ls -la build/

    - name: Verify build files
      run: |
        echo "Final build directory structure:"
        find build/ -type f -print | sort
        
        # Verify electron.js exists
        if [ ! -f "build/electron.js" ]; then
          echo "ERROR: electron.js not found in build directory!"
          exit 1
        fi
        
        # Verify package.json exists
        if [ ! -f "build/package.json" ]; then
          echo "ERROR: package.json not found in build directory!"
          exit 1
        fi

    - name: Install electron-builder globally
      run: npm install -g electron-builder

    - name: Package application
      run: |
        # Ensure build directory exists before packaging
        mkdir -p build
        npm run build:win
        ls -la dist/

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: NexusExplorer-Installer
        path: |
          dist/*.exe
          dist/*.exe.blockmap
          dist/*.yml
        retention-days: 1

    - name: Create Release
      id: create_release
      uses: actions/create-release@v1
      if: github.event_name == 'push' && contains(github.ref, 'refs/tags/')
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        tag_name: ${{ github.ref }}
        release_name: Release ${{ github.ref }}
        draft: false
        prerelease: false

    - name: Upload Release Asset
      id: upload-release-asset 
      uses: actions/upload-release-asset@v1.0.2
      if: github.event_name == 'push' && contains(github.ref, 'refs/tags/')
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ./dist/Nexus Explorer Setup ${{ github.ref_name }}.exe
        asset_name: NexusExplorer-Setup-${{ github.ref_name }}.exe
        asset_content_type: application/octet-stream
